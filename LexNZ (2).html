<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexNZ — NZ Legal Study Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0f14;color:#e8e0d0;font-family:'Outfit',sans-serif;min-height:100vh}
.app{min-height:100vh;background:#0d0f14;background-image:radial-gradient(ellipse at 20% 0%,rgba(200,169,110,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(143,168,208,.06) 0%,transparent 60%);display:flex;flex-direction:column}
.nav{display:flex;border-bottom:1px solid rgba(200,169,110,.12);background:rgba(0,0,0,.25);overflow-x:auto;flex-shrink:0}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:#c8a96e;padding:.8rem 1.1rem;letter-spacing:-.02em;border-right:1px solid rgba(200,169,110,.12);flex-shrink:0;line-height:1.1}
.nav-logo small{font-family:'DM Mono',monospace;font-size:.42rem;letter-spacing:.15em;color:rgba(200,169,110,.4);display:block;text-transform:uppercase;margin-top:.15rem}
.nav-tabs{display:flex}
.nav-tab{background:none;border:none;border-bottom:2px solid transparent;padding:0 .85rem;cursor:pointer;white-space:nowrap;font-family:'Outfit',sans-serif;font-size:.73rem;color:rgba(232,224,208,.35);transition:all .2s;display:flex;align-items:center;gap:.3rem;min-height:50px}
.nav-tab:hover{color:rgba(232,224,208,.65)}
.nav-tab.active{color:#c8a96e;border-bottom-color:#c8a96e}
.badge{background:rgba(200,169,110,.15);border-radius:10px;padding:.08rem .32rem;font-size:.52rem;font-family:'DM Mono',monospace;color:#c8a96e}
.main{flex:1;padding:1.6rem 2rem;max-width:1100px;width:100%;margin:0 auto}
@media(max-width:700px){.main{padding:.9rem}}
.pane{display:none}.pane.on{display:block}
.sec{margin-bottom:1.6rem}
.lbl{font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(200,169,110,.5);margin-bottom:.65rem;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-bottom:.65rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.65rem}
@media(max-width:700px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}
.area-btn{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:.6rem .7rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.4rem;font-family:'Outfit',sans-serif;font-size:.78rem;color:rgba(232,224,208,.55);text-align:left;width:100%}
.area-btn:hover,.area-btn.on{background:rgba(255,255,255,.06);color:#e8e0d0}
.area-btn.on{border-color:var(--ac,#c8a96e);background:rgba(200,169,110,.08)}
.chip{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:.35rem .75rem;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;font-size:.73rem;color:rgba(232,224,208,.5);display:inline-flex;align-items:center;gap:.28rem}
.chip:hover{background:rgba(255,255,255,.06);color:#e8e0d0}
.chip.on{background:rgba(200,169,110,.12);border-color:rgba(200,169,110,.4);color:#c8a96e}
.chip.blue.on{background:rgba(143,168,208,.1);border-color:rgba(143,168,208,.35);color:#8fa8d0}
.juris-btn{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:.52rem .72rem;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:.1rem;text-align:left;position:relative;width:100%}
.juris-btn:hover{background:rgba(255,255,255,.05)}
.juris-btn.binding{border-color:rgba(200,169,110,.28);background:rgba(200,169,110,.05)}
.juris-btn.on{border-color:var(--jc,#c8a96e);background:rgba(255,255,255,.04)}
.juris-btn.binding.on{border-color:#c8a96e;background:rgba(200,169,110,.1)}
.j-top{display:flex;align-items:center;gap:.32rem}
.j-name{font-size:.76rem;font-weight:500;color:rgba(232,224,208,.7);font-family:'Outfit',sans-serif}
.juris-btn.on .j-name{color:#e8e0d0}
.j-note{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.06em;color:rgba(232,224,208,.2);text-transform:uppercase}
.juris-btn.on .j-note{color:var(--jc,#c8a96e);opacity:.75}
.j-courts{font-family:'DM Mono',monospace;font-size:.48rem;color:rgba(232,224,208,.16)}
.always-on{position:absolute;top:.32rem;right:.45rem;font-family:'DM Mono',monospace;font-size:.46rem;letter-spacing:.1em;color:#c8a96e;text-transform:uppercase;opacity:.5}
.juris-info{background:rgba(143,168,208,.05);border:1px solid rgba(143,168,208,.1);border-radius:8px;padding:.5rem .85rem;font-family:'DM Mono',monospace;font-size:.6rem;color:rgba(232,224,208,.38);letter-spacing:.04em;line-height:1.5;margin-top:.5rem}
.qbox{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:.85rem 1rem;display:flex;flex-direction:column;gap:.65rem;transition:border-color .2s}
.qbox:focus-within{border-color:rgba(200,169,110,.28)}
textarea.qi{background:transparent;border:none;outline:none;font-family:'Outfit',sans-serif;font-size:.9rem;color:#e8e0d0;resize:none;min-height:72px;width:100%;line-height:1.65}
textarea.qi::placeholder{color:rgba(232,224,208,.18)}
.qfoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.05);padding-top:.65rem;gap:.5rem;flex-wrap:wrap}
.qmeta{font-family:'DM Mono',monospace;font-size:.57rem;color:rgba(232,224,208,.22);letter-spacing:.07em}
.btn-gold{background:#c8a96e;border:none;border-radius:8px;padding:.48rem 1.2rem;font-family:'Outfit',sans-serif;font-size:.8rem;font-weight:500;color:#0d0f14;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.32rem}
.btn-gold:hover:not(:disabled){background:#d4b87a;transform:translateY(-1px)}
.btn-gold:disabled{opacity:.36;cursor:not-allowed}
.btn-ghost{background:none;border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:.26rem .7rem;font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.1em;color:rgba(232,224,208,.28);cursor:pointer;transition:all .2s}
.btn-ghost:hover{color:#e8e0d0;border-color:rgba(255,255,255,.2)}
.btn-sm{background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.18);border-radius:6px;padding:.26rem .62rem;font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.07em;color:rgba(200,169,110,.65);cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-sm:hover{background:rgba(200,169,110,.15);color:#c8a96e}
.btn-icon{background:none;border:none;cursor:pointer;font-size:.9rem;padding:.16rem .32rem;border-radius:4px;transition:all .15s;opacity:.42;line-height:1}
.btn-icon:hover,.btn-icon.on{opacity:1;background:rgba(255,255,255,.05)}
.add-toggle{cursor:pointer;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;color:rgba(200,169,110,.55);border:1px solid rgba(200,169,110,.2);border-radius:6px;padding:.26rem .62rem;background:none;transition:all .2s;white-space:nowrap}
.add-toggle:hover{color:#c8a96e;border-color:rgba(200,169,110,.4)}
.res-panel{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;animation:fadeIn .3s ease;margin-bottom:.8rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.res-hdr{padding:.7rem 1.05rem;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:flex-start;justify-content:space-between;background:rgba(200,169,110,.04);gap:.45rem}
.res-tag{font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.13em;text-transform:uppercase;color:#c8a96e}
.res-q{font-size:.77rem;color:rgba(232,224,208,.56);margin-top:.16rem;font-family:'Outfit',sans-serif}
.res-area{font-family:'DM Mono',monospace;font-size:.57rem;color:rgba(232,224,208,.28);letter-spacing:.07em}
.res-body{padding:1.1rem 1.3rem;font-size:.87rem;line-height:1.75;color:rgba(232,224,208,.82);white-space:pre-wrap;font-family:'Outfit',sans-serif}
.res-body strong{color:#c8a96e;font-weight:600}
.loading{display:flex;align-items:center;gap:.42rem;padding:1.2rem;color:rgba(232,224,208,.38);font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.1em}
.dot{width:5px;height:5px;border-radius:50%;background:#c8a96e;animation:pulse 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.empty{text-align:center;padding:2.5rem 2rem;color:rgba(232,224,208,.18)}
.empty-icon{font-size:2rem;margin-bottom:.6rem;opacity:.32}
.empty-text{font-family:'Cormorant Garamond',serif;font-size:1rem;font-style:italic}
.ai-box{background:rgba(200,169,110,.05);border:1px solid rgba(200,169,110,.13);border-radius:12px;padding:1.05rem 1.3rem;margin-top:.85rem;animation:fadeIn .3s ease}
.ai-title{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:#c8a96e;margin-bottom:.6rem}
.ai-body{font-size:.86rem;line-height:1.75;color:rgba(232,224,208,.82);white-space:pre-wrap;font-family:'Outfit',sans-serif}
.ai-body strong{color:#c8a96e}
.ff{border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.07);transition:border-color .2s;margin-bottom:.8rem}
.ff:focus-within{border-color:var(--fc,#8fa8d0)}
.ff-hdr{padding:.52rem .9rem;display:flex;align-items:center;justify-content:space-between;background:rgba(143,168,208,.04);border-bottom:1px solid rgba(255,255,255,.05)}
.ff-lbl{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.12em;color:var(--fc,#8fa8d0);text-transform:uppercase}
.ff-hint{font-family:'DM Mono',monospace;font-size:.5rem;color:rgba(232,224,208,.2);letter-spacing:.04em}
.ff textarea{background:transparent;border:none;outline:none;font-family:'Outfit',sans-serif;font-size:.86rem;color:#e8e0d0;resize:none;min-height:70px;width:100%;line-height:1.65;padding:.68rem .9rem}
.ff textarea::placeholder{color:rgba(232,224,208,.17)}
.finput{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:.46rem .7rem;font-family:'Outfit',sans-serif;font-size:.82rem;color:#e8e0d0;outline:none;width:100%;transition:border-color .2s}
.finput:focus{border-color:rgba(200,169,110,.28)}
.finput::placeholder{color:rgba(232,224,208,.18)}
.fsel{background:#161820;border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:.46rem .7rem;font-family:'Outfit',sans-serif;font-size:.82rem;color:#e8e0d0;outline:none;width:100%}
.flabel{font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(200,169,110,.48);margin-bottom:.26rem;display:block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
@media(max-width:560px){.frow{grid-template-columns:1fr}}
.scenario-box{background:rgba(143,168,208,.05);border:1px solid rgba(143,168,208,.13);border-radius:14px;padding:1.25rem 1.35rem;margin-bottom:1.2rem}
.scen-lbl{font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.13em;text-transform:uppercase;color:#8fa8d0;margin-bottom:.52rem}
.scen-text{font-size:.88rem;line-height:1.75;color:rgba(232,224,208,.78);font-family:'Outfit',sans-serif}
.scen-hint{margin-top:.65rem;font-family:'DM Mono',monospace;font-size:.57rem;color:rgba(143,168,208,.42);letter-spacing:.04em}
.ilac-acc{display:flex;flex-direction:column;gap:.65rem}
.ilac-card{border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.07);cursor:pointer}
.ilac-card.open{border-color:var(--sc,#8fa8d0)}
.ilac-hdr{padding:.9rem 1.05rem;display:flex;align-items:center;gap:.85rem;background:rgba(255,255,255,.02)}
.ilac-card.open .ilac-hdr{background:rgba(143,168,208,.05)}
.ilac-letter{font-family:'Cormorant Garamond',serif;font-size:1.85rem;font-weight:700;color:var(--sc,#8fa8d0);line-height:1;flex-shrink:0;width:2rem;text-align:center}
.ilac-title{font-size:.9rem;font-weight:500;color:rgba(232,224,208,.78);font-family:'Outfit',sans-serif}
.ilac-card.open .ilac-title{color:#e8e0d0}
.ilac-sub{font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.1em;color:rgba(232,224,208,.27);text-transform:uppercase;margin-top:.1rem}
.ilac-chev{margin-left:auto;color:rgba(232,224,208,.27);font-size:.72rem;transition:transform .2s}
.ilac-card.open .ilac-chev{transform:rotate(180deg);color:var(--sc,#8fa8d0)}
.ilac-body{padding:0 1.05rem 1.05rem 3.7rem;display:none}
.ilac-card.open .ilac-body{display:block}
.ilac-desc{font-size:.85rem;line-height:1.7;color:rgba(232,224,208,.66);margin-bottom:.65rem}
.ilac-tips{display:flex;flex-direction:column;gap:.35rem}
.ilac-tip{display:flex;gap:.52rem;align-items:flex-start;font-size:.79rem;color:rgba(232,224,208,.5);line-height:1.5}
.tip-dot{width:5px;height:5px;border-radius:50%;background:var(--sc,#8fa8d0);margin-top:.46rem;flex-shrink:0}
.ilac-eg{margin-top:.65rem;background:rgba(255,255,255,.025);border-left:3px solid var(--sc,#8fa8d0);border-radius:0 8px 8px 0;padding:.68rem .88rem;font-size:.79rem;color:rgba(232,224,208,.57);line-height:1.6;font-style:italic}
.ilac-eg-lbl{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sc,#8fa8d0);margin-bottom:.36rem;font-style:normal}
.quiz-prog{display:flex;align-items:center;gap:.7rem;margin-bottom:1.2rem;flex-wrap:wrap}
.quiz-score{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:#c8a96e}
.quiz-score-lbl{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,224,208,.26);margin-top:.08rem}
.quiz-bar-wrap{flex:1;min-width:100px;height:4px;background:rgba(255,255,255,.06);border-radius:2px}
.quiz-bar{height:100%;background:#c8a96e;border-radius:2px;transition:width .4s ease}
.quiz-qbox{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:1.3rem 1.4rem;margin-bottom:.9rem}
.quiz-area{font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.13em;text-transform:uppercase;color:rgba(200,169,110,.45);margin-bottom:.65rem}
.quiz-q{font-family:'Outfit',sans-serif;font-size:.97rem;line-height:1.6;color:#e8e0d0;font-weight:500}
.quiz-opts{display:flex;flex-direction:column;gap:.52rem;margin-top:1rem}
.quiz-opt{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:.65rem .95rem;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;font-size:.85rem;color:rgba(232,224,208,.7);text-align:left;display:flex;align-items:center;gap:.55rem;width:100%}
.quiz-opt:hover:not([disabled]){background:rgba(255,255,255,.06);color:#e8e0d0;transform:translateX(2px)}
.quiz-opt[disabled]{cursor:default}
.quiz-opt.correct{background:rgba(122,184,160,.12);border-color:rgba(122,184,160,.5);color:#7ab8a0}
.quiz-opt.wrong{background:rgba(224,112,112,.1);border-color:rgba(224,112,112,.4);color:#e07070}
.opt-letter{font-family:'DM Mono',monospace;font-size:.6rem;width:1.2rem;flex-shrink:0;opacity:.5}
.quiz-expl{background:rgba(200,169,110,.06);border:1px solid rgba(200,169,110,.13);border-radius:10px;padding:.85rem 1.05rem;margin-top:.8rem;font-size:.83rem;line-height:1.65;color:rgba(232,224,208,.7);font-family:'Outfit',sans-serif;animation:fadeIn .3s ease}
.quiz-expl strong{color:#c8a96e}
.quiz-done{text-align:center;padding:2.5rem}
.final-score{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:700;color:#c8a96e}
.final-lbl{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(232,224,208,.28);margin-top:.28rem;margin-bottom:1.4rem}
.fc-wrap{perspective:1200px;cursor:pointer;margin-bottom:.9rem;min-height:220px}
.fc{width:100%;min-height:220px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;top:0;left:0;width:100%;min-height:220px;backface-visibility:hidden;border-radius:16px;padding:1.7rem 1.9rem;display:flex;flex-direction:column;justify-content:center}
.fc-front{background:rgba(143,168,208,.08);border:1px solid rgba(143,168,208,.18)}
.fc-back{background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.18);transform:rotateY(180deg)}
.fc-lbl{font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.75rem;opacity:.42}
.fc-front .fc-lbl{color:#8fa8d0}.fc-back .fc-lbl{color:#c8a96e}
.fc-text{font-family:'Outfit',sans-serif;font-size:.97rem;line-height:1.7;color:#e8e0d0}
.fc-back .fc-text{font-size:.86rem;white-space:pre-wrap;color:rgba(232,224,208,.85)}
.fc-hint{font-family:'DM Mono',monospace;font-size:.57rem;color:rgba(232,224,208,.23);margin-top:.9rem;letter-spacing:.07em}
.fc-nav{display:flex;align-items:center;justify-content:space-between;gap:.9rem;margin-top:.45rem}
.fc-dots{display:flex;gap:.28rem;flex-wrap:wrap;justify-content:center;flex:1}
.fc-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.1);transition:all .2s;cursor:pointer;border:none}
.fc-dot.active{background:#c8a96e}.fc-dot.seen{background:rgba(200,169,110,.32)}
.fc-count{font-family:'DM Mono',monospace;font-size:.6rem;color:rgba(232,224,208,.28);letter-spacing:.1em;text-align:center;margin-top:.4rem}
.case-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.42rem}
.case-name{font-family:'Cormorant Garamond',serif;font-size:.95rem;font-weight:600;color:#c8a96e;font-style:italic}
.case-cit{font-family:'DM Mono',monospace;font-size:.6rem;color:rgba(232,224,208,.37);letter-spacing:.04em}
.case-area{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,224,208,.2)}
.case-principle{font-size:.79rem;line-height:1.5;color:rgba(232,224,208,.6)}
.case-foot{display:flex;align-items:center;justify-content:space-between;padding-top:.36rem;border-top:1px solid rgba(255,255,255,.05);margin-top:auto}
.case-tag-pill{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.07em;padding:.1rem .42rem;border-radius:10px;background:rgba(200,169,110,.09);color:rgba(200,169,110,.62)}
.gloss-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:.85rem .95rem}
.gloss-term{font-family:'Cormorant Garamond',serif;font-size:.97rem;font-weight:600;color:#c8a96e;margin-bottom:.24rem}
.gloss-area{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,224,208,.2);margin-bottom:.42rem}
.gloss-def{font-size:.8rem;line-height:1.6;color:rgba(232,224,208,.6);font-family:'Outfit',sans-serif}
.bm-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;margin-bottom:.72rem}
.bm-hdr{padding:.62rem .92rem;background:rgba(200,169,110,.03);border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:flex-start;justify-content:space-between;gap:.45rem}
.bm-meta{font-family:'DM Mono',monospace;font-size:.57rem;color:rgba(232,224,208,.27);letter-spacing:.07em}
.bm-q{font-size:.79rem;color:rgba(232,224,208,.65);margin-top:.16rem;font-family:'Outfit',sans-serif}
.bm-body{padding:.85rem 1rem;font-size:.82rem;line-height:1.68;color:rgba(232,224,208,.7);white-space:pre-wrap;max-height:185px;overflow-y:auto}
.bm-body strong{color:#c8a96e}

  {term:"Actus reus",area:"criminal",def:"The physical element of a crime — the guilty act or omission. Must be proven alongside mens rea to establish criminal liability."},

function h(tag,cls,html,attrs){
  const a=attrs?Object.entries(attrs).map(([k,v])=>`${k}="${v}"`).join(" "):"";
  return `<${tag}${cls?` class="${cls}"`:""}${a?` ${a}`:""}>` +(html||"")+`</${tag}>`;
}
function fmt(t){return (t||"").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")}
function save(key,val){
  try{localStorage.setItem(key,typeof val==="string"?val:JSON.stringify(val));}catch(e){}
  S.saveShow=true; render(); setTimeout(()=>{S.saveShow=false;render();},2000);
}

async function callClaude(messages,system,maxTokens=1000){
  if(!S.apiKey) return "⚠️ Please enter your Anthropic API key above to use AI features.";
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,system,messages})
    });
    const d=await r.json();
    if(d.error) return "Error: "+d.error.message;
    return d.content?.map(b=>b.text||"").join("")||"No response.";
  }catch(e){return "Connection error. Check your internet connection and API key.";}
}
function buildSys(){
  const aL=LAW_AREAS.find(a=>a.id===S.selArea)?.label||"General NZ Law";
  const tL=QUERY_TYPES.find(t=>t.id===S.selType)?.label||"Legal Research";
  const perJuris=JURISDICTIONS.filter(j=>S.selJuris.includes(j.id)&&j.type==="persuasive");
  const jurisInstr=perJuris.length
    ?`PRIMARY: NZ (binding). PERSUASIVE: ${perJuris.map(j=>j.label).join(", ")}. Label persuasive cases clearly. Explain their relevance to NZ law.`
    :"NZ only — cite NZ cases and statutes.";
  return `You are LexNZ, an expert NZ legal research assistant for NZ law students. Area: ${aL}. Task: ${tL}. ${jurisInstr} Always: cite NZ cases with full citations, reference NZ legislation, use PEEAL/IRAC for arguments, **bold** case names and legislation, be precise and educational.`;
}

// ── LIBRARY ───────────────────────────────────────────────────────────────────
function renderLibrary(){
  const filtered=S.cases.filter(c=>!S.caseSearch||c.name.toLowerCase().includes(S.caseSearch.toLowerCase())||(c.principle||"").toLowerCase().includes(S.caseSearch.toLowerCase())||c.area.toLowerCase().includes(S.caseSearch.toLowerCase()));
  let html=`<div class="row"><div><span class="lbl" style="margin-bottom:.12rem;display:block">Case Library</span><span style="font-size:.82rem;color:rgba(232,224,208,.42)">Key NZ and persuasive precedents. Add your own as you study.</span></div><div style="display:flex;gap:.42rem;align-items:center;flex-wrap:wrap"><span class="save-ok${S.saveShow?" show":""}">✓ Saved</span><input class="search-input" placeholder="Search cases..." value="${S.caseSearch}" oninput="S.caseSearch=this.value;render()"><button class="add-toggle" onclick="S.showAddCase=!S.showAddCase;render()">${S.showAddCase?"Cancel":"+ Add Case"}</button></div></div>`;
  if(S.showAddCase){
    const nc=S.newCase;
    html+=`<div style="background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:1.05rem;margin:.8rem 0 1.1rem;display:flex;flex-direction:column;gap:.65rem"><span class="lbl" style="margin:0">Add New Case</span><div class="frow"><div><label class="flabel">Case Name *</label><input class="finput" placeholder="e.g. Smith v Jones" value="${nc.name}" oninput="S.newCase.name=this.value"></div><div><label class="flabel">Citation *</label><input class="finput" placeholder="e.g. [2020] NZSC 12" value="${nc.cit}" oninput="S.newCase.cit=this.value"></div></div><div class="frow"><div><label class="flabel">Jurisdiction</label><select class="fsel" onchange="S.newCase.jur=this.value">${JURISDICTIONS.map(j=>`<option value="${j.id}"${nc.jur===j.id?" selected":""}>${j.flag} ${j.label}</option>`).join("")}</select></div><div><label class="flabel">Area of Law</label><select class="fsel" onchange="S.newCase.area=this.value">${LAW_AREAS.map(a=>`<option value="${a.id}"${nc.area===a.id?" selected":""}>${a.label}</option>`).join("")}</select></div></div><div><label class="flabel">Key Principle</label><input class="finput" placeholder="What did this case establish?" value="${nc.principle||""}" oninput="S.newCase.principle=this.value"></div><button class="btn-gold" style="align-self:flex-start" onclick="addCase()" ${!nc.name||!nc.cit?"disabled":""}>Save Case</button></div>`;
  }
  html+=`<div class="grid-auto" style="margin-top:.8rem">${filtered.map((c,i)=>{const juris=JURISDICTIONS.find(j=>j.id===c.jur);const area=LAW_AREAS.find(a=>a.id===c.area);return `<div class="case-card"><div class="case-name">${c.name}</div><div class="case-cit">${c.cit} ${juris?.flag||""}</div><div class="case-area">${area?.label||c.area} · ${juris?.label||c.jur}</div>${c.principle?`<div class="case-principle">${c.principle}</div>`:""}<div class="case-foot"><span class="case-tag-pill">${c.type||"Case"}</span><button class="btn-icon" onclick="deleteCase(${c.id})" title="Delete">🗑️</button></div></div>`;}).join("")}${filtered.length===0?`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📚</div><div class="empty-text">No cases match</div></div>`:""}</div>`;
  return html;
}

// ── GLOSSARY ──────────────────────────────────────────────────────────────────
function renderGlossary(){
  const areas=["all",...new Set(GLOSSARY.map(g=>g.area))];
  const filtered=GLOSSARY.filter(g=>(S.glossFilter==="all"||g.area===S.glossFilter)&&(!S.glossSearch||g.term.toLowerCase().includes(S.glossSearch.toLowerCase())||g.def.toLowerCase().includes(S.glossSearch.toLowerCase())));
  let html=`<div class="row"><div><span class="lbl" style="margin-bottom:.12rem;display:block">Legal Glossary</span><span style="font-size:.82rem;color:rgba(232,224,208,.42)">Plain English definitions of key legal terms and maxims.</span></div><input class="search-input" placeholder="Search terms..." value="${S.glossSearch}" oninput="S.glossSearch=this.value;render()"></div>`;
  html+=`<div class="type-strip" style="margin:.75rem 0">${areas.map(a=>`<button class="chip${S.glossFilter===a?" on":""}" onclick="S.glossFilter='${a}';render()">${a==="all"?"All":a==="general"?"General":LAW_AREAS.find(x=>x.id===a)?.label||a}</button>`).join("")}</div>`;
  html+=`<div class="grid-auto">${filtered.map(g=>`<div class="gloss-card"><div class="gloss-term">${g.term}</div><div class="gloss-area">${g.area==="general"?"General Law":LAW_AREAS.find(a=>a.id===g.area)?.label||g.area}</div><div class="gloss-def">${g.def}</div></div>`).join("")}${filtered.length===0?`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📖</div><div class="empty-text">No terms match</div></div>`:""}</div>`;
  return html;
}

// ── BOOKMARKS ─────────────────────────────────────────────────────────────────
function renderBookmarks(){
  let html=`<div class="row"><div><span class="lbl" style="margin-bottom:.12rem;display:block">Bookmarked Research</span><span style="font-size:.82rem;color:rgba(232,224,208,.42)">Saved from your research sessions.</span></div><div style="display:flex;gap:.42rem;align-items:center"><span class="save-ok${S.saveShow?" show":""}">✓ Saved</span>${S.bookmarks.length>0?`<button class="btn-ghost" onclick="S.bookmarks=[];save('lexnz-bookmarks',S.bookmarks);render()">Clear All</button>`:""}</div></div>`;
  if(S.bookmarks.length===0) html+=`<div class="empty"><div class="empty-icon">🔖</div><div class="empty-text">Bookmark results using the 🏷️ icon in Research</div></div>`;
  html+=S.bookmarks.map((item,i)=>`<div class="bm-card"><div class="bm-hdr"><div style="flex:1"><div class="bm-meta">${item.type?.icon||""} ${item.type?.label||""} · ${item.area?.label||"General NZ Law"} · ${(item.jurisdictions||[]).map(j=>j.flag).join(" ")}</div><div class="bm-q">${item.query}</div></div><div style="display:flex;gap:.32rem"><button class="btn-sm" onclick="exportPDF('Q: ${item.query.replace(/'/g,"\\'").replace(/\n/g,"\\n")}\\n\\n${item.response.replace(/'/g,"\\'").replace(/\n/g,"\\n")}','LexNZ — ${(item.type?.label||"Research").replace(/'/g,"\\'")}')">PDF</button><button class="btn-icon" onclick="removeBm(${i})" title="Remove">✕</button></div></div><div class="bm-body">${fmt(item.response)}</div></div>`).join("");
  return html;
}

// ── API KEY BAR ───────────────────────────────────────────────────────────────
function renderApiBar(){
  return `<div class="api-key-bar"><label>Anthropic API Key</label><input type="password" placeholder="sk-ant-..." value="${S.apiKey}" oninput="S.apiKey=this.value;localStorage.setItem('lexnz-apikey',this.value)" autocomplete="off"><div class="api-key-note">Required for AI features. Get your key at console.anthropic.com<br>Quiz, Flashcards, Glossary &amp; Case Library work offline without a key.</div></div>`;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function setTab(t){S.tab=t;render();}
function toggleArea(id){S.selArea=S.selArea===id?null:id;render();}
function toggleJuris(id){if(id==="nz")return;S.selJuris=S.selJuris.includes(id)?S.selJuris.filter(x=>x!==id):[...S.selJuris,id];render();}
function toggleBm(i){const item=S.history[i];const exists=S.bookmarks.find(b=>b.id===item.id);S.bookmarks=exists?S.bookmarks.filter(b=>b.id!==item.id):[item,...S.bookmarks];save("lexnz-bookmarks",S.bookmarks);}
function removeBm(i){S.bookmarks.splice(i,1);save("lexnz-bookmarks",S.bookmarks);}
function addCase(){if(!S.newCase.name||!S.newCase.cit)return;const nc={...S.newCase,id:Date.now()};S.cases=[nc,...S.cases];S.newCase={name:"",cit:"",jur:"nz",area:"tort",principle:"",type:"Leading"};S.showAddCase=false;save("lexnz-cases",S.cases);}
function deleteCase(id){S.cases=S.cases.filter(c=>c.id!==id);save("lexnz-cases",S.cases);}
function setQuizFilter(f){S.quizFilter=f;S.quizQs=(f==="all"?[...QUIZ_QS]:QUIZ_QS.filter(q=>q.area===f)).sort(()=>Math.random()-.5);S.quizIdx=0;S.quizSel=null;S.quizDone=false;S.quizScore=0;render();}
function resetQuiz(){S.quizQs=[...S.quizQs].sort(()=>Math.random()-.5);S.quizIdx=0;S.quizSel=null;S.quizDone=false;S.quizScore=0;render();}
function answerQuiz(i){if(S.quizSel!==null)return;S.quizSel=i;if(i===S.quizQs[S.quizIdx].ans)S.quizScore++;render();}
function nextQuiz(){if(S.quizIdx+1>=S.quizQs.length){S.quizDone=true;}else{S.quizIdx++;S.quizSel=null;}render();}
function setFcFilter(f){S.fcFilter=f;S.fcIdx=0;S.fcFlipped=false;S.fcSeen=new Set();render();}
function nextFc(){const cards=S.fcFilter==="all"?FLASHCARDS:FLASHCARDS.filter(c=>c.area===S.fcFilter);S.fcSeen.add(S.fcIdx);S.fcFlipped=false;S.fcIdx=(S.fcIdx+1)%cards.length;render();}
function prevFc(){const cards=S.fcFilter==="all"?FLASHCARDS:FLASHCARDS.filter(c=>c.area===S.fcFilter);S.fcFlipped=false;S.fcIdx=(S.fcIdx-1+cards.length)%cards.length;render();}
function goFc(i){S.fcFlipped=false;S.fcIdx=i;render();}
function nextScenario(){S.ilacScenIdx=(S.ilacScenIdx+1)%ILAC_SCENARIOS.length;S.ilacPract={issue:"",law:"",application:"",conclusion:""};S.ilacPractResult=null;render();}

async function doResearch(){
  const inp=document.getElementById("queryInput");
  const q=(inp?inp.value:S.query).trim();
  if(!q||S.loading)return;
  S.loading=true;S.query="";render();
  const activeArea=LAW_AREAS.find(a=>a.id===S.selArea);
  const activeType=QUERY_TYPES.find(t=>t.id===S.selType);
  const juris=JURISDICTIONS.filter(j=>S.selJuris.includes(j.id));
  const text=await callClaude([{role:"user",content:q}],buildSys());
  S.history=[{id:Date.now(),query:q,response:text,area:activeArea,type:activeType,jurisdictions:juris},...S.history];
  S.loading=false;render();
}

async function doPeeal(){
  const filled=Object.values(S.peeal).filter(v=>v.trim());
  if(filled.length<3||S.loading)return;
  S.loading=true;render();
  const prompt=`Review this PEEAL argument${S.peealArea?` in ${S.peealArea}`:""}:\nP: ${S.peeal.point}\nE: ${S.peeal.explanation}\nE: ${S.peeal.evidence}\nA: ${S.peeal.application}\nL: ${S.peeal.link}\n\nProvide: (1) enhanced PEEAL version, (2) missing NZ citations, (3) one key weakness. **Bold** case names and legislation.`;
  S.peealResult=await callClaude([{role:"user",content:prompt}],"You are LexNZ, an expert NZ legal writing tutor. Help students build strong PEEAL arguments grounded in NZ law.");
  S.loading=false;render();
}

async function doIlacBuild(){
  const filled=Object.values(S.ilacBuild).filter(v=>v.trim());
  if(filled.length<2||S.loading)return;
  S.loading=true;render();
  const prompt=`Review this ILAC analysis${S.ilacBuildArea?` in ${S.ilacBuildArea}`:""}:\nI: ${S.ilacBuild.issue}\nL: ${S.ilacBuild.law}\nA: ${S.ilacBuild.application}\nC: ${S.ilacBuild.conclusion}\n\nProvide: (1) enhanced ILAC version, (2) section feedback, (3) NZ cases/legislation to add, (4) top improvement tip. **Bold** case names and legislation.`;
  S.ilacBuildResult=await callClaude([{role:"user",content:prompt}],"You are LexNZ, an expert NZ legal writing tutor specialising in the ILAC method.");
  S.loading=false;render();
}

async function doIlacPractice(){
  const filled=Object.values(S.ilacPract).filter(v=>v.trim());
  if(filled.length<2||S.loading)return;
  S.loading=true;render();
  const sc=ILAC_SCENARIOS[S.ilacScenIdx];
  const prompt=`Mark this ILAC answer for ${sc.area}:\nSCENARIO: ${sc.facts}\nI: ${S.ilacPract.issue}\nL: ${S.ilacPract.law}\nA: ${S.ilacPract.application}\nC: ${S.ilacPract.conclusion}\n\nProvide: (1) mark out of 10, (2) section scores (I/2, L/3, A/3, C/2), (3) model answer with NZ citations, (4) single most important improvement. **Bold** case names and legislation.`;
  S.ilacPractResult=await callClaude([{role:"user",content:prompt}],"You are LexNZ, an expert NZ law tutor. Mark ILAC answers fairly with specific feedback and always provide a model answer.",1200);
  S.loading=false;render();
}

function bindEvents(){
  const inp=document.getElementById("queryInput");
  if(inp){
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))doResearch();});
    inp.value=S.query||"";
    inp.addEventListener("input",e=>S.query=e.target.value);
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
